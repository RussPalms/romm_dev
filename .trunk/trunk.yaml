# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.29.0
  sha256:
    darwin_arm64: a3e55ccc8a55998b9944de8eb41b7fc0133988cbe36eec1fa5a14d4e8efc60fd
    darwin_x86_64: 687877916fd208629bd18624bd205915956cd14b99ce1582c8d519c6b54a06b2
    linux_x86_64: 39b7bfdc8eda677e595b83172c5fc7bd2e7588f4c6926aa56ff3e26578e9b3e8
    linux_arm64: f6a6678dbe392f2f11a27bd41a7fd6cf52b4b366c93b3ae0df16ca521ebffcf6
    windows_x86_64: a794b2911dba47b077d7f1170eab51b4cb22b096a243a89dfe125b793d7e9ccb
    mingw_x86_64: 1e8251eeb5ef29d9198351e4337421fbcdfc629fe81609062fed2f71aaba0a79
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.6.2
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@18.12.1
    - python@3.12.2
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    - zizmor@1.32.0
    # pinact 5 accepts only --format, but the Trunk plugin release passes -format.
    - pinact@5.0.2
    - dotenv-linter@4.0.0
    - hadolint@2.15.1
    - markdownlint@0.50.0
    - eslint@10.14.0
    - actionlint@1.7.12
    - bandit@1.9.4
    - black@26.10.1
    - checkov@3.4.3
    - git-diff-check
    - isort@9.0.2
    - osv-scanner@2.7.1
    - prettier@3.9.10:
        packages:
          - "@trivago/prettier-plugin-sort-imports@6.0.2"
          - "@vue/compiler-sfc@3.5.45"
    - ruff@0.17.4
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - taplo@0.10.0
    - trivy@0.76.2
    - trufflehog@3.99.8
    - yamllint@1.38.0
  ignore:
    - linters: [ALL]
      paths:
        - frontend/src/__generated__/**
        - docker/Dockerfile
        - docker/nginx/js/**
  files:
    - name: vue
      extensions: [vue]
  definitions:
    - name: eslint
      files:
        - javascript
        - typescript
      commands:
        - name: lint
          run_from: ${root_or_parent_with_any_config}
    - name: prettier
      files:
        - typescript
        - yaml
        - css
        - postcss
        - sass
        - html
        - markdown
        - json
        - javascript
        - graphql
        - vue
        - prettier_supported_configs
actions:
  disabled:
    - trunk-check-pre-push
  enabled:
    - trunk-announce
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
