# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.22.4
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.6.2
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@18.12.1
    - python@3.12.2
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    - zizmor@1.31.1
    # pinact 5 accepts only --format, but the Trunk plugin release passes -format.
    - pinact@5.0.2
    - dotenv-linter@4.0.0
    - hadolint@2.15.1
    - markdownlint@0.50.0
    - eslint@10.13.0
    - actionlint@1.7.12
    - bandit@1.9.4
    - black@26.10.1
    - checkov@3.3.30
    - git-diff-check
    - isort@9.0.2
    - osv-scanner@2.7.0
    - prettier@3.9.10:
        packages:
          - "@trivago/prettier-plugin-sort-imports@6.0.2"
          - "@vue/compiler-sfc@3.5.44"
    - ruff@0.17.2
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - taplo@0.10.0
    - trivy@0.76.1
    - trufflehog@3.99.7
    - yamllint@1.38.0
  ignore:
    - linters: [ALL]
      paths:
        - frontend/src/__generated__/**
        - docker/Dockerfile
        - docker/nginx/js/**
  files:
    - name: vue
      extensions: [vue]
  definitions:
    - name: eslint
      files:
        - javascript
        - typescript
      commands:
        - name: lint
          run_from: ${root_or_parent_with_any_config}
    - name: prettier
      files:
        - typescript
        - yaml
        - css
        - postcss
        - sass
        - html
        - markdown
        - json
        - javascript
        - graphql
        - vue
        - prettier_supported_configs
actions:
  disabled:
    - trunk-check-pre-push
  enabled:
    - trunk-announce
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
